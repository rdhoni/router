# ==============================================================================
# MbahRouter - Nginx Reverse Proxy Configuration Template
# Repository: https://github.com/rdhoni/router
# ==============================================================================
# Petunjuk Penggunaan:
# 1. Pastikan WebSocket map terpasang di /etc/nginx/conf.d/websocket.conf
#    (atau di dalam blok http {} di /etc/nginx/nginx.conf):
#
#    map $http_upgrade $connection_upgrade {
#        default upgrade;
#        ''      close;
#    }
#
# 2. Salin template ini ke: /etc/nginx/sites-available/llm.domainanda.com
#    sudo cp nginx.example.conf /etc/nginx/sites-available/llm.domainanda.com
# 3. Sesuaikan server_name dan port proxy (default port MbahRouter: 8317 atau 14555)
# 4. Aktifkan vhost:
#    sudo ln -s /etc/nginx/sites-available/llm.domainanda.com /etc/nginx/sites-enabled/
# 5. Pasang SSL gratis Let's Encrypt:
#    sudo certbot --nginx -d llm.domainanda.com
# 6. Uji dan reload Nginx:
#    sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

server {
    server_name llm.domainanda.com;

    # Ukuran maksimum body request (2GB untuk upload backup & dokumen Telegram bot)
    client_max_body_size 2048M;

    # Kompresi Gzip untuk mempercepat transfer file SPA dari ~3.9MB menjadi ~900KB
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Lokasi Utama (Proxy ke MbahRouter)
    # --------------------------------------------------------------------------
    location / {
        # Arahkan ke port MbahRouter (default: 8317 atau port custom Anda)
        proxy_pass http://127.0.0.1:8317;
        proxy_http_version 1.1;

        # Header standar reverse proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dukungan WebSocket (hanya melakukan upgrade jika diminta client)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # MATIKAN BUFFERING:
        # Sangat krusial agar streaming respon LLM (Server-Sent Events / SSE)
        # langsung terkirim realtime ke client tanpa jeda, serta mencegah
        # pemotongan bundle web SPA.
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeout panjang agar request reasoning/thinking panjang tidak terputus
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # Cache Invalidation untuk SPA Dashboard
    # Memastikan browser/CDN tidak menyimpan cache file HTML versi usang
    # saat binary MbahRouter diperbarui.
    # --------------------------------------------------------------------------
    location = / {
        proxy_pass http://127.0.0.1:8317;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:8317;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    listen 80;
}
